<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f4f4f5;color:#18181b;overscroll-behavior:none}
header{position:sticky;top:0;z-index:50;background:#1a1a1a;color:#fff;padding:env(safe-area-inset-top) 0 0 0}
.hbar{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
.hbar h1{font-size:17px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}
main{padding:14px 14px 120px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center}
label{display:block;font-size:12px;font-weight:600;color:#52525b;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px}
input,textarea,select{width:100%;padding:13px;border:1.5px solid #d4d4d8;border-radius:10px;font-size:16px;font-family:inherit;background:#fff}
textarea{min-height:96px;resize:vertical}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:#1a1a1a;color:#fff;font-weight:600;margin-top:12px}
.btn.sec{background:#fff;color:#1a1a1a;border:1.5px solid #d4d4d8}
.btn.red{background:#dc2626}
.btn.green{background:#15803d}
.btn:disabled{opacity:.4}
.btn.sm{padding:11px;font-size:14px;margin-top:0}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:40;width:64px;height:64px;border-radius:32px;background:#dc2626;color:#fff;border:0;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.tabs{display:flex;background:#262626}
.tabs button{flex:1;background:none;border:0;color:#a1a1aa;padding:13px 4px;font-size:13px;font-weight:600;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:#dc2626}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.item img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#e4e4e7;flex:none}
.item .txt{flex:1;min-width:0}
.item .t1{font-weight:700;font-size:15px}
.item .t2{font-size:13px;color:#52525b;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.num{background:#dc2626;color:#fff;font-weight:800;border-radius:6px;padding:1px 7px;font-size:13px;margin-right:6px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.pill.open{background:#fee2e2;color:#b91c1c}
.pill.done{background:#dcfce7;color:#15803d}
.pill.gray{background:#e4e4e7;color:#3f3f46}
.pill.urg{background:#fef3c7;color:#92400e}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;margin:0;border-bottom:1px solid #f4f4f5;text-transform:none;letter-spacing:0;font-size:15px;font-weight:500;color:#18181b}
.chk input{width:22px;height:22px;flex:none;padding:0}
.chk i{font-style:normal;color:#71717a;font-size:13px}
.chap{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:13px;font-weight:700;color:#3f3f46;text-transform:uppercase;letter-spacing:.3px}
.chap .cn{background:#1a1a1a;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px}
.chap .cc{margin-left:auto;background:#e4e4e7;color:#52525b;border-radius:20px;padding:1px 9px;font-size:12px}
.empty{text-align:center;color:#71717a;padding:50px 20px;font-size:15px}
.planwrap{position:relative;overflow:hidden;background:#e4e4e7;border-radius:12px;touch-action:none;height:calc(100vh - 260px);min-height:300px}
.planwrap canvas{position:absolute;top:0;left:0;transform-origin:0 0}
.hint{background:#fef3c7;border:1px solid #fcd34d;color:#78350f;padding:11px 13px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:10px}
.ph{width:100%;border-radius:12px;background:#e4e4e7;display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mut{font-size:13px;color:#71717a;line-height:1.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#18181b;color:#fff;padding:12px 18px;border-radius:24px;font-size:14px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:88%;text-align:center}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:flex;align-items:center;justify-content:center;padding:30px;color:#fff;text-align:center;font-size:16px;font-weight:600;flex-direction:column;gap:14px}
.bar{width:220px;height:6px;background:#3f3f46;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:#dc2626;width:0}
hr{border:0;border-top:1px solid #e4e4e7;margin:16px 0}
h3{font-size:15px;margin:0 0 10px}
.card.en{border-left:4px solid #1d4ed8}
.card.en h3 span{font-weight:400;color:#71717a;font-size:13px}
.seg{display:flex;border:1.5px solid #d4d4d8;border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{flex:1;background:#fff;border:0;padding:13px 6px;font-weight:700;font-size:14px;color:#52525b}
.seg button.on{background:#1a1a1a;color:#fff}
/* home a sezioni */
.sec-card{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:16px 14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-left:5px solid #dc2626}

.sec-card .t1{font-weight:700;font-size:16px}
.sec-card .t2{font-size:13px;color:#71717a;line-height:1.4;margin-top:2px}

<body>
<header>
  <div class="hbar"><button class="back" id="btnBack" hidden>&#8592;</button><h1 id="title">Report di cantiere</h1><button class="back" id="btnHome" hidden>&#8962;</button></div>

<script>
"use strict";
/* ============ DB ============
   projects = anagrafiche cantiere (nome, indirizzo, pianta, elenchi)
   docs     = documenti: snag list, site visit report, minutes of meeting
   defects  = voci del documento (nome dello store lasciato invariato
              per non perdere i dati gia' registrati sui telefoni)        */
let db;
const DBN="punchlist_v1";
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBN,2);
 r.onupgradeneeded=e=>{const d=e.target.result,tx=e.target.transaction;
   if(!d.objectStoreNames.contains("projects"))d.createObjectStore("projects",{keyPath:"id"});
   let s;
   if(!d.objectStoreNames.contains("defects")){s=d.createObjectStore("defects",{keyPath:"id"});s.createIndex("pid","projectId");}
   else s=tx.objectStore("defects");
   if(!s.indexNames.contains("did"))s.createIndex("did","docId");
   if(!d.objectStoreNames.contains("docs")){const t=d.createObjectStore("docs",{keyPath:"id"});t.createIndex("pid","projectId");}
 };
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error);});}
function os(n,m){return db.transaction(n,m||"readonly").objectStore(n)}
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const dbPut=(n,o)=>req(os(n,"readwrite").put(o)).then(()=>o);
const dbGet=(n,id)=>req(os(n).get(id));
const dbAll=n=>req(os(n).getAll());
const dbDel=(n,id)=>req(os(n,"readwrite").delete(id));
const dbByDoc=did=>req(os("defects").index("did").getAll(did));

/* ============ util ============ */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(3,"0");
function toast(m,ms){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||2600);}
let ovlEl=null;
function busy(msg){if(!ovlEl){ovlEl=document.createElement("div");ovlEl.className="ovl";ovlEl.innerHTML='<div id="ovlMsg"></div><div class="bar"><i id="ovlBar"></i></div>';document.body.appendChild(ovlEl);}$("#ovlMsg").textContent=msg;$("#ovlBar").style.width="0%";}
function busyPct(p){if(ovlEl)$("#ovlBar").style.width=Math.round(p*100)+"%";}
function unbusy(){if(ovlEl){ovlEl.remove();ovlEl=null;}}
const pad2=n=>String(n).padStart(2,"0");
function today(){const d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
function itDate(iso){if(!iso)return"";const p=String(iso).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:iso;}
const urls=[];
function url(b){if(!b)return"";const u=URL.createObjectURL(b);urls.push(u);return u;}
function freeUrls(){while(urls.length)URL.revokeObjectURL(urls.pop());}
const slug=s=>(s||"doc").replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"");

/* camera / file */
/* cam=true apre direttamente la fotocamera; cam=false lascia scegliere
   dalla galleria del telefono. multi=true permette di prenderne piu' di una. */
function pickFiles(cam,multi){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="image/*";if(cam)i.capture="environment";if(multi)i.multiple=true;i.onchange=()=>res(i.files?Array.from(i.files):[]);i.click();});}
function pickFile(cam){return pickFiles(cam,false).then(a=>a[0]||null);}
function pickDocx(){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document";i.onchange=()=>res(i.files&&i.files[0]||null);i.click();});}
async function resize(blob,max,q){
  const bmp=await createImageBitmap(blob);
  let w=bmp.width,h=bmp.height;
  const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(bmp,0,0,w,h);bmp.close();
  return await new Promise(r=>c.toBlob(r,"image/jpeg",q||0.85));
}

/* ============ traduzione IT -> EN ============ */
/* Termini di cantiere che le traduzioni automatiche sbagliano:
   li riscrivo in italiano non ambiguo PRIMA di tradurre. Aggiungine pure. */
const GLOSS=[
  [/\bfughe\b/gi,"stuccature dei giunti"],
  [/\bfuga\b/gi,"stuccatura del giunto"],
  [/\bsgusci\b/gi,"raccordi curvi a parete"],
  [/\bsguscio\b/gi,"raccordo curvo a parete"],
  [/\briprese\s+di\s+tinta\b/gi,"riverniciature parziali"],
  [/\bripresa\s+di\s+tinta\b/gi,"riverniciatura parziale"]
];
const normIT=t=>GLOSS.reduce((s,[re,v])=>s.replace(re,v),t);
function fetchT(u,ms){
  const c=new AbortController(),id=setTimeout(()=>c.abort(),ms||9000);
  return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(id));
}
/* Due servizi gratuiti in sequenza: se il primo non risponde si passa al secondo. */
async function it2en(txt){
  const t=(txt||"").trim();if(!t)return "";
  if(!navigator.onLine)throw new Error("sei offline");
  const src=normIT(t);
  try{
    const r=await fetchT("https://translate.googleapis.com/translate_a/single?client=gtx&sl=it&tl=en&dt=t&q="+encodeURIComponent(src));
    if(r.ok){const j=await r.json();const o=(j[0]||[]).map(s=>s[0]).join("").trim();if(o)return o;}
  }catch(e){}
  try{
    const r=await fetchT("https://api.mymemory.translated.net/get?langpair=it|en&q="+encodeURIComponent(src.slice(0,480)));
    if(r.ok){const j=await r.json();const o=((j.responseData||{}).translatedText||"").trim();
      if(o&&!/MYMEMORY WARNING/i.test(o))return o;}
  }catch(e){}
  throw new Error(navigator.onLine?"servizio di traduzione non raggiungibile":"sei offline");
}

const ORDER=["snag","report","mom"];
const cfg=()=>TYPES[(S.doc&&S.doc.type)||S.type||"snag"];
function tabsOf(c){
  const a=[{k:"items",l:c.itemsTab}];
  if(c.usePhotos)a.push({k:"photos",l:"FOTO"});
  if(c.usePlan)a.push({k:"plan",l:"PIANTA"});
  a.push({k:"head",l:"INTESTAZIONE"},{k:"exp",l:"ESPORTA"});
  return a;
}
/* codice della voce dentro il report: capitolo + progressivo (es. 5.4) */
function chapOf(c,k){return (c.chapters||[]).find(x=>x.k===k)||(c.chapters||[])[0];}
function itemCode(c,d,i){const ch=chapOf(c,d.chapter);return ch?ch.n+"."+(i+1):d.num;}
function isOpen(c,d){return c.chapters?d.flag!=="OK":d.status!=="done";}

/* ============ router ============ */
async function go(v,opt){S.view=v;Object.assign(S,opt||{});await render();window.scrollTo(0,0);}
window.addEventListener("popstate",()=>{if(S.view!=="home"){back();history.pushState({},"");}});

const recById=id=>S.items.find(x=>x.id===id)||S.photos.find(x=>x.id===id);
async function autosave(){
  if(S.view==="item"){
    const it=recById(S.iid);
    if(it&&readItemForm(it))await dbPut("defects",it);
  }
  if(S.view==="photo"){
    const ph=recById(S.iid);
    if(ph&&$("#f_caption")){ph.caption=$("#f_caption").value.trim();ph.captionEn=$("#fe_caption").value.trim();await dbPut("defects",ph);}
  }
  if(S.view==="doc"&&S.tab==="head"&&$("#h_"+cfg().head[0].k)){readHeadForm(S.doc);readPresent(S.doc);await dbPut("docs",S.doc);}
}
async function back(){
  await autosave();
  const v=S.view;
  if(v==="place")go(S.placeBack||"item");
  else if(v==="item"||v==="photo")go("doc");
  else if(v==="doc"||v==="newdoc"||v==="import")go("docs");
  else if(v==="docs")go("home");
  else if(v==="site"||v==="newsite")go("sites");
  else if(v==="sites")go("home");
}

/* ============ render ============ */
async function render(){
  freeUrls();
  const m=$("#main"),t=$("#title"),tabs=$("#tabs"),fab=$("#fab"),bb=$("#btnBack"),bh=$("#btnHome");
  tabs.hidden=true;tabs.innerHTML="";fab.hidden=true;bb.hidden=S.view==="home";bh.hidden=S.view==="home";
  if(S.docId&&["doc","item","photo","place"].includes(S.view)){
    S.doc=await dbGet("docs",S.docId);
    S.proj=await dbGet("projects",S.doc.projectId);
    S.pid=S.doc.projectId;
    const all=(await dbByDoc(S.docId)).sort((a,b)=>a.num-b.num);
    S.items=all.filter(x=>x.kind!=="photo");
    S.photos=all.filter(x=>x.kind==="photo");
  }
  if(S.view==="home"){t.textContent="Report di cantiere";m.innerHTML=await viewHome();}
  else if(S.view==="docs"){t.textContent=TYPES[S.type].name;m.innerHTML=await viewDocs();fab.hidden=false;}
  else if(S.view==="newdoc"){t.textContent="Nuovo "+TYPES[S.type].name;m.innerHTML=await viewNewDoc();}
  else if(S.view==="import"){t.textContent="Importa da Word";m.innerHTML=await viewImport();}
  else if(S.view==="sites"){t.textContent="Cantieri";m.innerHTML=await viewSites();}
  else if(S.view==="newsite"){t.textContent="Nuovo cantiere";m.innerHTML=viewNewSite();}
  else if(S.view==="site"){S.proj=await dbGet("projects",S.pid);t.textContent=S.proj.name;m.innerHTML=await viewSite();}
  else if(S.view==="doc"){
    const c=cfg();S.type=S.doc.type;
    t.textContent=docLabel(S.doc,S.proj);
    tabs.hidden=false;
    if(!tabsOf(c).some(x=>x.k===S.tab))S.tab="items";
    tabs.innerHTML=tabsOf(c).map(x=>'<button data-tab="'+x.k+'"'+(x.k===S.tab?' class="on"':'')+'>'+x.l+'</button>').join("");
    if(S.tab==="items"){m.innerHTML=viewItems();fab.hidden=false;}
    else if(S.tab==="photos"){m.innerHTML=viewPhotos();fab.hidden=false;}
    else if(S.tab==="plan"){m.innerHTML=viewPlan();mountPlan(false);}
    else if(S.tab==="head"){m.innerHTML=viewHead();}
    else m.innerHTML=viewExport();
  }
  else if(S.view==="item"){
    const c=cfg(),it=recById(S.iid);
    const i=S.items.filter(x=>x.chapter===it.chapter).findIndex(x=>x.id===it.id);
    t.textContent=c.item+" "+(c.chapters?itemCode(c,it,i):"n° "+it.num);
    m.innerHTML=viewItem(it);
  }
  else if(S.view==="photo"){const ph=recById(S.iid);t.textContent="Foto n° "+(S.photos.findIndex(x=>x.id===ph.id)+1);m.innerHTML=viewPhoto(ph);}
  else if(S.view==="place"){const it=recById(S.iid);t.textContent="Posizione "+markLabel(it);m.innerHTML=viewPlace(it);mountPlan(true);}
  bind();
}

function fieldHTML(f,val,idp){
  const id=idp+f.k;
  let inp;
  if(f.t==="textarea")inp='<textarea id="'+id+'" placeholder="'+esc(f.ph||"")+'">'+esc(val||"")+'</textarea>';
  else if(f.t==="date")inp='<input id="'+id+'" type="date" value="'+esc(val||"")+'">';
  else if(f.t==="time")inp='<input id="'+id+'" type="time" value="'+esc(val||"")+'">';

  else inp='<input id="'+id+'"'+(f.list?' list="dl_'+f.list+'"':'')+' value="'+esc(val||"")+'" placeholder="'+esc(f.ph||"")+'">';

}

function readFields(o,fields,idp,suf){
  if(!$("#"+idp+fields[0].k))return false;
  for(const f of fields){
    const el=$("#"+idp+f.k);if(!el)continue;
    let v=el.value;
    if(f.t!=="date"&&f.t!=="time")v=v.trim();
    if(f.up)v=v.toUpperCase();
    o[f.k+(suf||"")]=v;
  }
  return true;
}

  const c=cfg();
  if(!$("#f_"+c.fields[0].k))return false;
  readFields(it,c.fields,"f_");
  const en=c.fields.filter(f=>f.en);
  if(en.length&&$("#fe_"+en[0].k))for(const f of en){const el=$("#fe_"+f.k);if(!el)continue;let v=el.value.trim();if(f.up)v=v.toUpperCase();it[f.k+"En"]=v;}

   Nella snag list i segnaposto sono i difetti e portano il loro numero.
   Nel weekly report sono le foto e portano il numero della didascalia. */
function markerList(){const c=cfg();return c.usePhotos?S.photos:S.items;}
function markLabel(rec){

let PL={img:null,scale:1,tx:0,ty:0,mode:false,step:0,tmp:null};
async function mountPlan(placeMode){
  const wrap=$("#pw");if(!wrap)return;
  const c=$("#pc");
  PL.img=await createImageBitmap(S.proj.plan);
  PL.mode=placeMode;PL.step=0;
  const d=placeMode?recById(S.iid):null;
  PL.tmp=d&&d.x!=null?{x:d.x,y:d.y,angle:d.angle}:null;
  PL.noArrow=!!(d&&d.x!=null&&d.angle==null);
  if(PL.tmp)PL.step=2;
  c.width=PL.img.width;c.height=PL.img.height;
  const fit=Math.min(wrap.clientWidth/PL.img.width,wrap.clientHeight/PL.img.height);
  PL.scale=fit;PL.tx=(wrap.clientWidth-PL.img.width*fit)/2;PL.ty=(wrap.clientHeight-PL.img.height*fit)/2;
  applyT();drawPlan(c.getContext("2d"));
  gestures(wrap,c);
}
function applyT(){const c=$("#pc");if(c)c.style.transform="translate("+PL.tx+"px,"+PL.ty+"px) scale("+PL.scale+")";}
function markerSize(){const k=(S.proj&&S.proj.mk)||1;return Math.max(8,Math.round(Math.max(PL.img.width,PL.img.height)/40*k));}
function drawMarker(g,x,y,ang,label,dim){
  const s=markerSize(),arrow=s*2.4,rad=ang*Math.PI/180;
  g.save();g.globalAlpha=dim?0.45:1;
  // arrow (omessa se ang è null)
  if(ang!=null){
  g.strokeStyle="#e30613";g.fillStyle="#e30613";g.lineWidth=Math.max(2,s*0.16);g.lineCap="round";
  const x0=x+Math.cos(rad)*s*0.75,y0=y+Math.sin(rad)*s*0.75;
  const x1=x+Math.cos(rad)*arrow,y1=y+Math.sin(rad)*arrow;
  g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();
  const hw=s*0.42,hl=s*0.78;
  g.beginPath();g.moveTo(x1,y1);
  g.lineTo(x1-Math.cos(rad)*hl-Math.cos(rad+Math.PI/2)*hw, y1-Math.sin(rad)*hl-Math.sin(rad+Math.PI/2)*hw);
  g.lineTo(x1-Math.cos(rad)*hl+Math.cos(rad+Math.PI/2)*hw, y1-Math.sin(rad)*hl+Math.sin(rad+Math.PI/2)*hw);
  g.closePath();g.fill();
  }
  // box
  const bw=s*(String(label).length>1?1.55:1.15),bh=s*1.15;
  g.fillStyle="#e30613";g.fillRect(x-bw/2,y-bh/2,bw,bh);
  g.fillStyle="#fff";g.font="800 "+Math.round(s*0.92)+"px Arial, sans-serif";g.textAlign="center";g.textBaseline="middle";
  g.fillText(String(label),x,y+s*0.03);
  g.restore();
}
function drawPlan(g,forExport){
  g.clearRect(0,0,PL.img.width,PL.img.height);
  g.drawImage(PL.img,0,0);
  const list=markerList(),usePh=!!cfg().usePhotos;
  list.forEach((d,i)=>{
    if(d.x==null)return;
    if(PL.mode&&d.id===S.iid)return;
    drawMarker(g,d.x,d.y,d.angle,usePh?i+1:d.num,PL.mode&&!forExport);
  });
  if(PL.mode&&PL.tmp){
    const i=list.findIndex(x=>x.id===S.iid),cur=list[i];
    drawMarker(g,PL.tmp.x,PL.tmp.y,PL.tmp.angle,usePh?i+1:(cur?cur.num:"?"));
  }
}
function gestures(wrap,c){
  const pts=new Map();let last=null,moved=0,pinch=null;
  const toPlan=(cx,cy)=>{const r=wrap.getBoundingClientRect();return{x:(cx-r.left-PL.tx)/PL.scale,y:(cy-r.top-PL.ty)/PL.scale};};
  wrap.onpointerdown=e=>{wrap.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
    if(pts.size===2){const a=[...pts.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:PL.scale,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};}
    last={x:e.clientX,y:e.clientY};};
  wrap.onpointermove=e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&pinch){const a=[...pts.values()];const nd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      const ns=Math.max(0.05,Math.min(12,pinch.s*nd/pinch.d));const r=wrap.getBoundingClientRect();
      const px=(pinch.mx-r.left-PL.tx)/PL.scale,py=(pinch.my-r.top-PL.ty)/PL.scale;
      PL.tx=pinch.mx-r.left-px*ns;PL.ty=pinch.my-r.top-py*ns;PL.scale=ns;applyT();moved=99;return;}
    if(pts.size===1&&last){const dx=e.clientX-last.x,dy=e.clientY-last.y;moved+=Math.abs(dx)+Math.abs(dy);
      PL.tx+=dx;PL.ty+=dy;last={x:e.clientX,y:e.clientY};applyT();}
  };
  wrap.onpointerup=wrap.onpointercancel=e=>{
    pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(pts.size===0)last=null;
    if(moved<9&&PL.mode&&pts.size===0){

        $("#stepHint").innerHTML="Fatto. Ritocca con il cursore o <b>Conferma</b>.";$("#angSl").value=Math.round(PL.tmp.angle);$("#angLbl").textContent=Math.round(PL.tmp.angle)+"°";}

/* ============ ZIP (store) ============ */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function dosTime(d){return((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))&0xFFFF;}
function dosDate(d){return(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;}
function makeZip(files){
  const enc=new TextEncoder(),now=new Date(),chunks=[],central=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),data=f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime(now),true);lh.setUint16(12,dosDate(now),true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime(now),true);ch.setUint16(14,dosDate(now),true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);
    ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);
    off+=30+nm.length+data.length;
  }
  let csize=0;for(const c of central)csize+=c.length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,csize,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:"application/zip"});
}

/* ============ rilettura di un Word ============
   Serve quando il report e' stato corretto a mano in Word dopo l'export:
   da quel testo riparte il report della settimana dopo, cosi' le correzioni
   non si riscrivono a mano. Si leggono solo i capitoli descrittivi, mai le
   foto: quelle si rifanno nel documento nuovo.

   Niente librerie, come nel resto dell'app. Lo zip si apre a mano partendo
   dal central directory (le dimensioni li' sono sempre giuste, nei local
   header a volte no) e i dati compressi passano per DecompressionStream, che
   Chrome ha nativo e funziona anche offline. */
const dvw=u8=>new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
async function unzipEntry(u8,want){
  const v=dvw(u8);
  let eo=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-70000;i--){if(v.getUint32(i,true)===0x06054b50){eo=i;break;}}
  if(eo<0)throw new Error("non sembra un file .docx");
  const n=v.getUint16(eo+10,true);
  let p=v.getUint32(eo+16,true);
  const dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(v.getUint32(p,true)!==0x02014b50)throw new Error("archivio illeggibile");
    const method=v.getUint16(p+10,true),csize=v.getUint32(p+20,true);
    const nl=v.getUint16(p+28,true),el=v.getUint16(p+30,true),cl=v.getUint16(p+32,true);
    const off=v.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nl));
    if(name===want){
      const lnl=v.getUint16(off+26,true),lel=v.getUint16(off+28,true);
      const start=off+30+lnl+lel;
      const data=u8.subarray(start,start+csize);
      if(method===0)return data;
      if(method!==8)throw new Error("compressione non gestita");
      if(typeof DecompressionStream==="undefined")throw new Error("questo browser non sa decomprimere il file");
      const st=new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(st).arrayBuffer());
    }
    p+=46+nl+el+cl;
  }
  throw new Error("dentro il file manca "+want);
}
const WNS="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
/* i figli di un elemento, sciogliendo i content control (w:sdt): la data e
   certe celle dei format aziendali stanno dentro quelli e altrimenti
   sparirebbero dalla lettura. */
function* wkids(el){
  for(const ch of el.children){
    if(ch.localName==="sdt"){
      const c=[...ch.children].find(x=>x.localName==="sdtContent");
      if(c)yield* wkids(c);
    }else yield ch;
  }
}
const wclean=s=>(s||"").replace(/\s+/g," ").trim();
function wbold(r){
  const rp=[...r.children].find(x=>x.localName==="rPr");
  if(!rp)return false;
  const b=[...rp.children].find(x=>x.localName==="b");
  if(!b)return false;
  const v=b.getAttributeNS(WNS,"val")||b.getAttribute("w:val");
  return !(v==="0"||v==="false");
}
function wruns(p){
  const out=[];
  for(const r of p.getElementsByTagNameNS(WNS,"r")){
    let s="";
    for(const nd of r.childNodes){
      if(nd.localName==="t")s+=nd.textContent;
      else if(nd.localName==="br"||nd.localName==="cr"||nd.localName==="tab")s+=" ";
    }
    if(s)out.push({t:s,b:wbold(r)});
  }
  return out;
}
const wtext=runs=>runs.map(r=>r.t).join("");
const wpara=p=>wclean(wtext(wruns(p)));
function wblocks(tc){
  const out=[];
  for(const el of wkids(tc)){
    if(el.localName!=="p")continue;
    const runs=wruns(el),full=wclean(wtext(runs));
    if(full)out.push({full:full,runs:runs});
  }
  return out;
}
const wcell=tc=>wblocks(tc).map(b=>b.full).join(" ");
/* Titolo e descrizione stanno nella stessa cella: il titolo e' la parte in
   grassetto in testa, come "Facade: Polverini will try to adjust...". Si
   prendono i run in grassetto iniziali (Word ne spezza uno in tre appena
   correggi una lettera, quindi si rimettono insieme). Se il grassetto non
   c'e', non c'e' titolo e il testo va tutto nella descrizione: e' la regola
   di Giulia, nei suoi report la voce senza etichetta e' scritta di seguito,
   senza grassetto e senza due punti. */
function wsplit(tc){
  const b=wblocks(tc);
  if(!b.length)return{title:"",description:""};
  if(b.length>1){
    const lab=b[0].runs.length&&b[0].runs.every(r=>r.b);
    if(lab)return{title:b[0].full.replace(/[:\-\u2013]\s*$/,""),description:b.slice(1).map(x=>x.full).join("\n")};
    return{title:"",description:b.map(x=>x.full).join("\n")};
  }
  const runs=b[0].runs;
  let i=0,t="";
  while(i<runs.length&&runs[i].b){t+=runs[i].t;i++;}
  t=wclean(t).replace(/[:\-\u2013]\s*$/,"");
  const rest=wclean(wtext(runs.slice(i))).replace(/^[:\-\u2013]\s*/,"");
  if(t&&t.length<=60&&rest.length>=10)return{title:t,description:rest};
  return{title:"",description:b[0].full};
}
function wrow(tr){const out=[];for(const el of wkids(tr))if(el.localName==="tc")out.push(el);return out;}
/* capitolo dell'app -> titolo nel Word, gli stessi di weekly.py */
const WCHAP=[["permits","permits and approvals"],["design","design"],
  ["construction","construction activity"],["co_gc","general contractor"],
  ["co_mw","millwork"],["risk","risk / question list/ site issues"],
  ["notes","remarkable notes"],["shipment","shipment"]];
const wnorm=s=>wclean(s).toLowerCase().replace(/\s*\/\s*/g,"/").replace(/[.:]+$/,"");
function wtable(tbl){
  const rows=[];for(const el of wkids(tbl))if(el.localName==="tr")rows.push(el);
  if(rows.length<2)return[];
  const head=wrow(rows[0]).map(wcell),n=head.length,low=head.map(x=>x.toLowerCase());
  const flags=n>=5&&/critical/.test(low[n-3]||"")&&/urgent/.test(low[n-2]||"");
  const cost=/cost/.test(low[2]||"")&&/delay/.test(low[3]||"");
  const ship=!flags&&/description/.test(low[2]||"");
  const out=[];
  for(let i=1;i<rows.length;i++){
    const c=wrow(rows[i]);
    if(c.length<2)continue;
    const it={title:"",description:"",supplier:"",when:"",cost:"",delay:"",flag:""};
    if(ship){
      it.title=wcell(c[1]);it.description=c[2]?wcell(c[2]):"";
      it.supplier=c[3]?wcell(c[3]):"";it.when=c[4]?wcell(c[4]):"";
    }else{
      const t=wsplit(c[1]);it.title=t.title;it.description=t.description;
      if(cost){it.cost=c[2]?wcell(c[2]):"";it.delay=c[3]?wcell(c[3]):"";}
      else if(n>=7){it.supplier=c[2]?wcell(c[2]):"";it.when=c[3]?wcell(c[3]):"";}
    }
    if(flags&&c.length>=n){
      const a=wcell(c[n-3]),b=wcell(c[n-2]),d=wcell(c[n-1]);
      if(a)it.flag="CRITICAL";
      else if(b)it.flag="URGENT";
      else if(d){it.flag="OK";
        /* nei change order la colonna OK porta lo stato scritto ("approved") */
        if(cost&&d.toUpperCase()!=="X")it.when=d;}
    }
    if(!it.title&&!it.description&&!it.cost)continue;
    out.push(it);
  }
  return out;
}
function parseWeekly(xml){
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  if(doc.getElementsByTagName("parsererror").length)throw new Error("XML del documento illeggibile");
  const body=[...doc.documentElement.children].find(x=>x.localName==="body");
  if(!body)throw new Error("documento senza corpo");
  const out={reportNo:"",chapters:{}};
  let cur=null,cover="",seen=false;
  for(const el of wkids(body)){
    if(el.localName==="p"){
      const pr=[...el.children].find(x=>x.localName==="pPr");
      const st=pr?[...pr.children].find(x=>x.localName==="pStyle"):null;
      const sv=st?(st.getAttributeNS(WNS,"val")||st.getAttribute("w:val")||""):"";
      const txt=wpara(el);
      if(!txt)continue;
      if(/^(titolo|heading)/i.test(sv)){
        const hit=WCHAP.find(c=>wnorm(c[1])===wnorm(txt));
        cur=hit?hit[0]:null;seen=true;
      }else if(!seen)cover+=" "+txt;
      continue;
    }
    if(el.localName!=="tbl"||!cur)continue;
    /* di ogni capitolo si legge la prima tabella che lo segue */
    if(!out.chapters[cur])out.chapters[cur]=wtable(el);
    cur=null;
  }
  const m=/report\s*n\.?\s*(\d+)/i.exec(cover);
  if(m)out.reportNo=m[1];
  return out;
}
const bytes=b=>b.arrayBuffer().then(a=>new Uint8Array(a));

async function doZip(){
  const c=cfg();
  if(!S.items.length&&!S.photos.length){toast("Niente da esportare");return;}
  busy("Preparazione pacchetto…");
  try{
    const files=[],p=S.proj,D=S.doc,rec=[],prec=[];
    let i=0;const tot=S.items.length*2+S.photos.length+2;
    /* le voci, con il codice di capitolo che avranno nel Word (es. 5.4) */
    const seen={};
    for(const d of S.items){
      const r={num:d.num,status:d.status||"open",x:d.x,y:d.y,angle:d.angle,
               before:null,after:null,createdAt:d.createdAt,closedAt:d.closedAt||null};
      for(const f of c.fields){
        r[f.k]=d[f.k]||"";
        if(f.en)r[f.k+"En"]=d[f.k+"En"]||"";
      }
      if(!r.dueDate)r.dueDate=D.due||"";
      if(c.chapters){
        const ch=chapOf(c,d.chapter);
        seen[ch.k]=(seen[ch.k]||0)+1;
        r.chapter=ch.k;r.chapterNo=ch.n;r.chapterLabel=ch.l;r.code=ch.n+"."+seen[ch.k];
      }
      if(d.before){const b=await resize(d.before,2200,0.86);r.before="foto/"+pad(d.num)+"_before.jpg";files.push({name:r.before,data:await bytes(b)});}
      busyPct(++i/tot);
      if(d.after){const b=await resize(d.after,2200,0.86);r.after="foto/"+pad(d.num)+"_after.jpg";files.push({name:r.after,data:await bytes(b)});}
      busyPct(++i/tot);
      rec.push(r);
    }
    /* le foto del capitolo finale, numerate 1..N nell'ordine di scatto */
    for(let k=0;k<S.photos.length;k++){
      const ph=S.photos[k],n=k+1;
      const r={no:n,caption:ph.caption||"",captionEn:ph.captionEn||"",x:ph.x,y:ph.y,angle:ph.angle,file:null};
      if(ph.photo){const b=await resize(ph.photo,2200,0.86);r.file="foto/"+pad(n)+".jpg";files.push({name:r.file,data:await bytes(b)});}
      busyPct(++i/tot);
      prec.push(r);
    }
    if(c.usePlan&&p.plan){
      const ann=await annotatedPlan();files.push({name:"pianta_annotata.png",data:await bytes(ann)});busyPct(++i/tot);
      files.push({name:"pianta_base.png",data:await bytes(p.plan)});busyPct(++i/tot);
    }
    const head={};for(const f of c.head)head[f.k]=D[f.k]||"";
    if(c.usePresents)head.present=D.present||[];
    const meta={app:"cantiere",version:3,docType:c.t,docName:c.name,
      exportedAt:new Date().toISOString(),
      reportLang:D.lang||c.defLang||"it",
      project:{name:p.name,address:p.address||"",deadline:p.due||"",preparedBy:p.by||"",
               gc:p.gc||"",mw:p.mw||"",schedule:p.sched||{planned:{},actual:{}},
               distribution:parseDist(p.dist)},
      doc:head,
      fields:c.fields.map(f=>({key:f.k,label:f.l.replace(/&rsquo;/g,"'"),en:!!f.en})),
      items:rec};
    if(c.chapters)meta.chapters=c.chapters.map(ch=>({key:ch.k,no:ch.n,label:ch.l,cost:!!ch.cost}));
    if(c.groupBy){
      meta.groupBy=c.groupBy;
      meta.groups=groups(c);
      /* le voci escono raggruppate, nell'ordine in cui i topic compaiono */
      rec.sort((a,b)=>meta.groups.indexOf(a[c.groupBy]||"")-meta.groups.indexOf(b[c.groupBy]||""));
    }
    if(c.usePhotos)meta.photos=prec;
    /* la vecchia chiave "defects" resta per compatibilita' col generatore Word */
    if(c.t==="snag")meta.defects=rec;
    files.push({name:"report.json",data:new TextEncoder().encode(JSON.stringify(meta,null,2))});
    const zip=makeZip(files);
    const fn=slug(p.name)+"_"+c.t+"_"+(D.date||today())+".zip";
    unbusy();
    await shareOrDownload([new File([zip],fn,{type:"application/zip"})],c.name+" "+p.name);
  }catch(e){unbusy();toast("Errore export: "+e.message,5000);}
}
async function shareOrDownload(files,title){
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title});return;}catch(e){if(e.name==="AbortError")return;}
  }
  for(const f of files){const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click();await new Promise(r=>setTimeout(r,350));URL.revokeObjectURL(a.href);}
  toast("Scaricato in Download");
}

  for(const fl of c.fields)d[fl.k]=fl.fromDue?(D.due||""):"";
  for(const fl of c.fields.filter(x=>x.en))d[fl.k+"En"]="";
  /* nel weekly report la voce nasce nell'ultimo capitolo usato */
  if(c.chapters)d.chapter=(S.items.length?S.items[S.items.length-1].chapter:null)||c.chapters[0].k;
  if(c.groupBy&&S.items.length)d[c.groupBy]=S.items[S.items.length-1][c.groupBy]||"";
  await dbPut("defects",d);
  return go("item",{iid:d.id});
}
async function newPhoto(){
  const P=S.proj,D=S.doc;
  const f=await pickFile(true);if(!f)return;
  const p={id:uid(),kind:"photo",docId:D.id,projectId:P.id,num:nextNum(),
    photo:f,thumb:await resize(f,320,0.7),caption:"",captionEn:"",
    x:null,y:null,angle:0,createdAt:Date.now()};
  await dbPut("defects",p);
  return go("photo",{iid:p.id});
}
/* Foto gia' scattate, prese dalla galleria del telefono: piu' d'una alla volta.
   Le ordino per data di scatto (lastModified) cosi' la numerazione segue
   l'ordine reale, non quello in cui il selettore le restituisce. */
async function importPhotos(){
  const P=S.proj,D=S.doc;
  const files=await pickFiles(false,true);
  if(!files.length)return;
  files.sort((a,b)=>(a.lastModified||0)-(b.lastModified||0));
  busy("Aggiunta di "+files.length+" foto…");
  let n=nextNum(),last=null;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const p={id:uid(),kind:"photo",docId:D.id,projectId:P.id,num:n++,
      photo:f,thumb:await resize(f,320,0.7),caption:"",captionEn:"",
      x:null,y:null,angle:0,createdAt:Date.now()};
    await dbPut("defects",p);last=p;
    busyPct((i+1)/files.length);
  }
  unbusy();
  toast(files.length===1?"1 foto aggiunta":files.length+" foto aggiunte");
  if(files.length===1)return go("photo",{iid:last.id});
  return go("doc",{tab:"photos"});
}

async function act(a,id,el){
  const P=S.proj;
  const c=cfg();
  const d=recById(S.iid);
  /* qualunque azione dalla scheda conserva prima quello che c'è nei campi,
     anche quelle che portano altrove (pianta, traduzione, tab) */
  if(S.view==="item"&&d&&a!=="delItem"&&readItemForm(d))await dbPut("defects",d);
  if(S.view==="photo"&&d&&a!=="delPhoto"&&$("#f_caption")){
    d.caption=$("#f_caption").value.trim();d.captionEn=$("#fe_caption").value.trim();await dbPut("defects",d);
  }
  if(a==="translate")return translateItem();
  if(a==="translatePhoto"){
    if(!d.caption)return toast("Scrivi prima la didascalia");
    busy("Traduzione…");
    try{d.captionEn=await it2en(d.caption);await dbPut("defects",d);unbusy();return render();}
    catch(e){unbusy();return toast("Traduzione non riuscita: "+e.message,4500);}
  }
  if(a==="translateMissing")return translateMissing();
  if(a==="lang"){S.doc.lang=el.dataset.l;await dbPut("docs",S.doc);return render();}
  if(a==="install"){
    if(!installEvt)return toast("Usa il menu ⋮ di Chrome → Installa app");
    installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;
    toast(r.outcome==="accepted"?"App installata":"Installazione annullata");return render();
  }
  /* navigazione */
  if(a==="section")return go("docs",{type:id,tab:"items"});
  if(a==="sites")return go("sites");
  if(a==="newsite")return go("newsite");
  if(a==="opensite")return go("site",{pid:id});
  if(a==="newdoc")return go("newdoc");
  if(a==="opendoc")return go("doc",{docId:id,tab:"items"});
  if(a==="item")return go("item",{iid:id});
  if(a==="photo")return go("photo",{iid:id});
  if(a==="place")return go("place",{placeBack:S.view});

  /* cantiere */
  if(a==="pickplan"){const f=await pickFile(false);if(!f)return;tmpPlan=await resize(f,2600,0.92);const im=$("#planPrev");im.src=url(tmpPlan);im.hidden=false;return;}
  if(a==="pickplan2"){const f=await pickFile(false);if(!f)return;P.plan=await resize(f,2600,0.92);await dbPut("projects",P);toast("Planimetria aggiornata");return render();}
  if(a==="rotate"){
    if(!P.plan)return toast("Nessuna pianta da ruotare");
    busy("Rotazione…");
    const bmp=await createImageBitmap(P.plan),oldH=bmp.height;
    const c=document.createElement("canvas");c.width=bmp.height;c.height=bmp.width;
    const g=c.getContext("2d");g.translate(c.width,0);g.rotate(Math.PI/2);g.drawImage(bmp,0,0);bmp.close();
    P.plan=await new Promise(r=>c.toBlob(r,"image/png"));
    await dbPut("projects",P);
    /* ruotano tutti i marker del cantiere, non solo quelli del documento aperto */
    const all=await dbAll("defects");
    for(const d of all){if(d.projectId!==P.id||d.x==null)continue;const nx=oldH-d.y,ny=d.x;d.x=nx;d.y=ny;if(d.angle!=null)d.angle=(d.angle+90)%360;await dbPut("defects",d);}
    unbusy();toast("Pianta ruotata");return render();
  }
  if(a==="savesite"){
    const n=$("#f_name").value.trim();if(!n)return toast("Serve il nome del cantiere");
    const p={id:uid(),name:n,address:$("#f_addr").value.trim(),due:$("#f_due").value,by:$("#f_by").value.trim(),
      plan:tmpPlan,locations:DEF_LOC,suppliers:DEF_SUP,createdAt:Date.now()};
    tmpPlan=null;await dbPut("projects",p);toast("Cantiere creato");return go("site",{pid:p.id});
  }
  if(a==="savesitedata"){
    P.name=$("#f_name").value.trim();P.address=$("#f_addr").value.trim();P.due=$("#f_due").value;
    P.by=$("#f_by").value.trim();P.gc=$("#f_gc").value.trim();P.mw=$("#f_mw").value.trim();
    await dbPut("projects",P);toast("Salvato");return render();
  }
  if(a==="seed"){
    P.gc=P.gc||SEED_BHR.gc;P.mw=P.mw||SEED_BHR.mw;
    P.sched=P.sched||JSON.parse(JSON.stringify(SEED_BHR.sched));
    P.dist=P.dist||SEED_BHR.dist;
    await dbPut("projects",P);toast("Precompilato dai format");return render();
  }
  if(a==="savesched"){
    const s={planned:{},actual:{}};
    for(const [k] of SCHED){s.planned[k]=$("#sp_"+k).value;s.actual[k]=$("#sa_"+k).value;}
    P.sched=s;await dbPut("projects",P);toast("Programma salvato");return render();
  }
  if(a==="savedist"){P.dist=$("#f_dist").value;await dbPut("projects",P);toast(parseDist(P.dist).length+" persone in distribution list");return render();}
  if(a==="delsite"){
    const docs=(await dbAll("docs")).filter(d=>d.projectId===P.id);
    if(!confirm("Eliminare \""+P.name+"\" con "+docs.length+" documenti e tutte le foto?"))return;
    const all=await dbAll("defects");
    for(const d of all)if(d.projectId===P.id)await dbDel("defects",d.id);
    for(const d of docs)await dbDel("docs",d.id);
    await dbDel("projects",P.id);return go("sites");
  }

  /* documento */
  if(a==="impword"){
    const f=await pickDocx();if(!f)return;
    busy("Lettura del Word…");
    try{
      const xml=new TextDecoder().decode(await unzipEntry(new Uint8Array(await f.arrayBuffer()),"word/document.xml"));
      const r=parseWeekly(xml);
      let tot=0;for(const k in r.chapters)tot+=r.chapters[k].length;
      unbusy();
      if(!tot)return toast("Nessuna voce trovata nei capitoli: è un Weekly Report su quel format?",5000);
      IMP={file:f.name,chapters:r.chapters,reportNo:r.reportNo};
      return go("import");
    }catch(e){unbusy();return toast("Non riesco a leggere il file: "+e.message,5000);}
  }
  if(a==="saveimp"){
    const c=TYPES.report;
    const pid=$("#d_proj").value,p=await dbGet("projects",pid);
    const skip=!!($("#i_skipok")&&$("#i_skipok").checked);
    const D={id:uid(),projectId:pid,type:"report",lang:c.defLang||"it",createdAt:Date.now()};
    for(const f of c.head)D[f.k]=$("#d_"+f.k).value;
    if(!D.date)D.date=today();
    if(!D.due&&p)D.due=p.due||"";
    await dbPut("docs",D);
    let n=0;
    for(const ch of c.chapters)for(const it of (IMP.chapters[ch.k]||[])){
      if(skip&&it.flag==="OK")continue;
      const d={id:uid(),kind:"item",docId:D.id,projectId:pid,num:++n,
        before:null,thumb:null,after:null,status:"open",x:null,y:null,angle:0,createdAt:Date.now()};
      for(const fl of c.fields)d[fl.k]="";
      for(const fl of c.fields.filter(x=>x.en))d[fl.k+"En"]="";
      d.chapter=ch.k;
      /* il Word esportato e' in inglese: il testo torna nei campi inglesi */
      d.titleEn=it.title;d.descriptionEn=it.description;
      d.supplier=it.supplier;d.when=it.when;d.cost=it.cost;d.delay=it.delay;d.flag=it.flag;
      await dbPut("defects",d);
    }
    IMP=null;
    toast(n+" voci importate");
    return go("doc",{docId:D.id,tab:"items",type:"report"});
  }
  if(a==="savedoc"){
    const c=TYPES[S.type];
    const pid=$("#d_proj").value;
    const p=await dbGet("projects",pid);
    const D={id:uid(),projectId:pid,type:S.type,lang:c.defLang||"it",createdAt:Date.now()};
    for(const f of c.head)D[f.k]=$("#d_"+f.k).value;
    if(!D.date)D.date=today();
    if(!D.due&&p)D.due=p.due||"";
    await dbPut("docs",D);toast(c.name+" creato");return go("doc",{docId:D.id,tab:"items"});
  }
  if(a==="savehead"){readHeadForm(S.doc);readPresent(S.doc);await dbPut("docs",S.doc);toast("Salvato");return render();}
  if(a==="deldoc"){
    if(!confirm("Eliminare questo documento, le sue "+S.items.length+" voci e le "+S.photos.length+" foto?"))return;
    for(const x of S.items.concat(S.photos))await dbDel("defects",x.id);
    await dbDel("docs",S.doc.id);
    return go("docs",{type:S.doc.type});
  }
  if(a==="zip")return doZip();
  if(a==="gallery")return saveGallery();
  if(a==="newItem")return newItem();
  if(a==="newPhoto")return newPhoto();
  if(a==="pickGallery")return importPhotos();

  /* foto del report */
  if(a==="reshootGal"){const f=await pickFile(false);if(!f)return;d.photo=f;d.thumb=await resize(f,320,0.7);await dbPut("defects",d);return render();}
  if(a==="reshoot"){const f=await pickFile(true);if(!f)return;d.photo=f;d.thumb=await resize(f,320,0.7);await dbPut("defects",d);return render();}
  if(a==="savePhoto"){await dbPut("defects",d);toast("Salvato");return go("doc",{tab:"photos"});}
  if(a==="delPhoto"){if(!confirm("Eliminare questa foto?"))return;await dbDel("defects",d.id);return go("doc",{tab:"photos"});}

  /* voce */
  if(a==="shootBefore"){const f=await pickFile(true);if(!f)return;d.before=f;d.thumb=await resize(f,320,0.7);await dbPut("defects",d);return render();}
  if(a==="shootAfter"){const f=await pickFile(true);if(!f)return;d.after=f;if(d.status!=="done"){d.status="done";d.closedAt=Date.now();}await dbPut("defects",d);toast(c.doneMsg);return render();}
  if(a==="toggleDone"){d.status=d.status==="done"?"open":"done";d.closedAt=d.status==="done"?Date.now():null;await dbPut("defects",d);return render();}
  if(a==="saveItem"){
    readItemForm(d);
    if(d.location&&!(P.locations||[]).includes(d.location)){P.locations=[...(P.locations||[]),d.location];await dbPut("projects",P);}
    if(d.supplier&&!(P.suppliers||[]).includes(d.supplier)){P.suppliers=[...(P.suppliers||[]),d.supplier];await dbPut("projects",P);}
    if(d.topic&&!(P.topics||DEF_TOPIC).includes(d.topic)){P.topics=[...(P.topics||DEF_TOPIC),d.topic];await dbPut("projects",P);}
    await dbPut("defects",d);toast("Salvato");return go("doc",{tab:"items"});
  }
  if(a==="noarrow"){
    PL.noArrow=!PL.noArrow;
    if(PL.tmp)PL.tmp.angle=PL.noArrow?null:0;
    const b=$("#btnNoAr");b.className="btn "+(PL.noArrow?"":"sec")+" sm";
    b.innerHTML=(PL.noArrow?"&#10003; ":"")+"Solo numero, senza freccia";
    $("#angLbl").textContent=PL.noArrow?"nessuna":(PL.tmp?Math.round(PL.tmp.angle)+"°":"—");
    if(PL.tmp)drawPlan($("#pc").getContext("2d"));
    return;
  }
  if(a==="replace"){PL.tmp=null;PL.step=0;$("#stepHint").innerHTML="1 di 2 &mdash; tocca sulla pianta il punto in cui ti trovi";drawPlan($("#pc").getContext("2d"));return;}
  if(a==="savePlace"){if(!PL.tmp)return toast("Tocca prima la tua posizione");d.x=PL.tmp.x;d.y=PL.tmp.y;d.angle=PL.tmp.angle;await dbPut("defects",d);toast("Posizione salvata");return go(S.placeBack||"item");}
  if(a==="delItem"){if(!confirm("Eliminare questa "+c.item.toLowerCase()+"?"))return;await dbDel("defects",d.id);return go("doc",{tab:"items"});}
}

/* ============ migrazione dai dati vecchi ============
   Prima esisteva un solo elenco di difetti per cantiere. Ogni cantiere
   che ha difetti senza documento ne riceve uno di tipo Snag List, con
   dentro tutti i suoi difetti. Nessun dato viene perso. */
async function migrate(){
  /* la vecchia tipologia "site visit report" e' diventata il Weekly Report */
  const docs=await dbAll("docs");
  for(const D of docs){
    if(D.type!=="visit")continue;
    D.type="report";D.lang=D.lang||"en";await dbPut("docs",D);
    const its=await dbByDoc(D.id);
    for(const it of its){if(!it.chapter){it.chapter="construction";await dbPut("defects",it);}}
  }
  /* il verbale prima aveva Decisione e Azione in campi separati: il format
     aziendale ha una colonna sola, quindi confluiscono nella discussione */
  for(const D of docs){
    if(D.type!=="mom")continue;
    for(const it of await dbByDoc(D.id)){
      if(it.kind==="photo")continue;
      const extra=[it.decision,it.action].filter(x=>(x||"").trim());
      if(!extra.length&&!(!it.topic&&it.location))continue;
      if(!it.topic&&it.location)it.topic=it.location;
      if(extra.length){
        it.description=[(it.description||"").trim()].concat(extra).filter(Boolean).join("\n");
        it.decision="";it.action="";
      }
      await dbPut("defects",it);
    }
  }
  const all=await dbAll("defects");
  const orphan=all.filter(d=>!d.docId);
  if(!orphan.length)return;
  const projs=await dbAll("projects");
  const map={};
  for(const p of projs){
    if(!orphan.some(d=>d.projectId===p.id))continue;
    const D={id:uid(),projectId:p.id,type:"snag",lang:p.lang||"it",
      date:today(),title:"Snag list",due:p.due||"",by:p.by||"",
      createdAt:p.createdAt||Date.now()};
    await dbPut("docs",D);map[p.id]=D.id;
  }
  let n=0;
  for(const d of orphan){
    if(!map[d.projectId])continue;
    d.docId=map[d.projectId];await dbPut("defects",d);n++;
  }
  if(n)toast("Aggiornamento: "+n+" difetti spostati nelle snag list dei cantieri",5000);
}

(async()=>{
  await openDB();
  await migrate();
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if("serviceWorker" in navigator){
    // chiedo a ogni avvio se c'è una versione nuova, altrimenti Chrome può
    // tenersi quella vecchia per giorni
    navigator.serviceWorker.register("sw.js").then(reg=>{reg.update().catch(()=>{});}).catch(()=>{});

    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(!first)toast("Aggiornamento scaricato. Chiudi e riapri l'app per usarlo.",6000);
      first=false;
    });
  }
  history.pushState({},"");
  await go("home");
})();
